<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Integration Tests - Ayed Academy STEP Book</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:2rem}
h1{font-size:1.5rem;color:#60a5fa;margin-bottom:.25rem}
.sub{color:#64748b;font-size:.9rem;margin-bottom:2rem}
.suite{margin-bottom:2rem}
.suite-title{font-size:1rem;font-weight:700;color:#f0abfc;margin-bottom:.75rem;padding-bottom:.4rem;border-bottom:1px solid #1e293b}
.test{display:flex;align-items:flex-start;gap:.75rem;padding:.55rem .75rem;border-radius:6px;margin-bottom:.35rem;font-size:.875rem}
.test.pass{background:rgba(34,197,94,.08);border-left:3px solid #22c55e}
.test.fail{background:rgba(239,68,68,.1);border-left:3px solid #ef4444}
.test.skip{background:rgba(234,179,8,.08);border-left:3px solid #eab308}
.badge{font-weight:700;font-size:.75rem;padding:2px 8px;border-radius:20px;flex-shrink:0}
.pass .badge{background:#22c55e22;color:#22c55e}
.fail .badge{background:#ef444422;color:#ef4444}
.skip .badge{background:#eab30822;color:#eab308}
.test-name{flex:1}
.test-detail{font-size:.72rem;color:#f87171;font-family:monospace;margin-top:2px}
.summary{background:#1e293b;border-radius:12px;padding:1.25rem;margin-bottom:2rem;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.sum-item{text-align:center}
.sum-num{font-size:2rem;font-weight:800}
.sum-label{font-size:.75rem;color:#64748b}
.pass-num{color:#22c55e}.fail-num{color:#ef4444}.total-num{color:#60a5fa}.skip-num{color:#eab308}
.progress-bar{flex:1;height:8px;background:#0f172a;border-radius:4px;overflow:hidden;min-width:200px}
.progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .5s}
.run-info{color:#475569;font-size:.75rem;margin-top:1.5rem;text-align:center}
.note{background:#1e293b;border-radius:8px;padding:.75rem 1rem;font-size:.8rem;color:#94a3b8;margin-bottom:1.5rem;border-left:3px solid #60a5fa}
</style>
</head>
<body>
<h1>Integration Tests - Ayed Academy STEP Book</h1>
<p class="sub">Testing feature connectivity and end-to-end flows</p>
<div class="note">
Note: These tests verify that all modules communicate correctly.
API tests require the server at localhost:3000. DOM tests run in isolation.
</div>
<div class="summary">
<div class="sum-item"><div class="sum-num total-num" id="s-total">0</div><div class="sum-label">Total</div></div>
<div class="sum-item"><div class="sum-num pass-num" id="s-pass">0</div><div class="sum-label">Pass</div></div>
<div class="sum-item"><div class="sum-num fail-num" id="s-fail">0</div><div class="sum-label">Fail</div></div>
<div class="sum-item"><div class="sum-num skip-num" id="s-skip">0</div><div class="sum-label">Skip</div></div>
<div class="progress-bar"><div class="progress-fill" id="s-bar" style="width:0%"></div></div>
</div>
<div id="output"></div>
<div class="run-info" id="run-info"></div>
<script src="../js/icons.js"></script>
<script>
var R={pass:0,fail:0,skip:0,total:0},out=document.getElementById('output'),cs=null;
function suite(n){cs=document.createElement('div');cs.className='suite';cs.innerHTML='<div class="suite-title">'+n+'</div>';out.appendChild(cs);}
function test(n,f){R.total++;var el=document.createElement('div');try{f();R.pass++;el.className='test pass';el.innerHTML='<span class="badge">PASS</span><span class="test-name">'+n+'</span>';}catch(e){R.fail++;el.className='test fail';el.innerHTML='<span class="badge">FAIL</span><span class="test-name">'+n+'</span><div class="test-detail">'+e.message+'</div>';}cs.appendChild(el);upd();}
function asyncTest(n,prom){R.total++;var el=document.createElement('div');el.className='test';el.innerHTML='<span class="badge" style="background:#1e293b;color:#64748b">WAIT</span><span class="test-name">'+n+'</span>';cs.appendChild(el);upd();return prom.then(function(){R.pass++;el.className='test pass';el.innerHTML='<span class="badge">PASS</span><span class="test-name">'+n+'</span>';upd();}).catch(function(e){R.fail++;el.className='test fail';el.innerHTML='<span class="badge">FAIL</span><span class="test-name">'+n+'</span><div class="test-detail">'+e.message+'</div>';upd();});}
function skipTest(n){R.total++;R.skip++;var el=document.createElement('div');el.className='test skip';el.innerHTML='<span class="badge">SKIP</span><span class="test-name">'+n+'</span>';cs.appendChild(el);upd();}
function upd(){document.getElementById('s-total').textContent=R.total;document.getElementById('s-pass').textContent=R.pass;document.getElementById('s-fail').textContent=R.fail;document.getElementById('s-skip').textContent=R.skip;var p=R.total>0?Math.round((R.pass/R.total)*100):0;document.getElementById('s-bar').style.width=p+'%';}
function eq(a,b){if(a!==b)throw new Error('Expected '+JSON.stringify(b)+' got '+JSON.stringify(a));}
function ok(v,m){if(!v)throw new Error(m||'Expected truthy got '+JSON.stringify(v));}
function has(s,k){if(!String(s).includes(k))throw new Error('Expected to contain ['+k+']');}

// ===== SUITE 1: API Connectivity =====
suite('1. API Connectivity (Server at localhost:3000)');

var apiData = null;
asyncTest('GET /api/units returns 200', fetch('/api/units').then(function(r){if(!r.ok)throw new Error('Status: '+r.status);}));
asyncTest('GET /api/units returns JSON object', fetch('/api/units').then(function(r){return r.json();}).then(function(d){apiData=d;ok(typeof d==='object','Expected object');ok(!Array.isArray(d),'Expected keyed object, not array');}));
asyncTest('API data has grammar track', fetch('/api/units').then(function(r){return r.json();}).then(function(d){ok('grammar' in d,'Expected grammar key');}));
asyncTest('API grammar units is array', fetch('/api/units').then(function(r){return r.json();}).then(function(d){ok(Array.isArray(d.grammar),'Expected grammar to be array');}));
asyncTest('Static index.html serves correctly', fetch('/').then(function(r){if(!r.ok)throw new Error('Status: '+r.status);return r.text();}).then(function(t){has(t,'Ayed Academy');}));
asyncTest('Admin page serves correctly', fetch('/public/admin.html').then(function(r){if(!r.ok)throw new Error('Status: '+r.status);return r.text();}).then(function(t){has(t,'لوحة التحكم');}));

// ===== SUITE 2: State Flow Integration =====
suite('2. State Flow Integration (GS Lifecycle)');

var GS={ALL_DATA:null,currentTrack:'grammar',UNITS:[],currentUnit:0,student:{name:'',completedUnits:[],notes:{},highlights:{},xp:0,level:1},ui:{highlightMode:false,eraserMode:false,fontSize:16},quizState:{answers:{},submitted:false,currentStep:0}};

test('Initial state: UNITS empty before data load', function(){eq(GS.UNITS.length,0);});
test('Track switch updates currentTrack', function(){GS.currentTrack='reading';eq(GS.currentTrack,'reading');GS.currentTrack='grammar';});
test('Unit completion registers correctly', function(){GS.student.completedUnits.push(1);ok(GS.student.completedUnits.includes(1));GS.student.completedUnits=[];});
test('XP accumulates across sessions', function(){GS.student.xp=50;GS.student.xp+=30;eq(GS.student.xp,80);GS.student.xp=0;});
test('Level upgrades at XP threshold', function(){GS.student.xp=100;var lv=Math.floor(GS.student.xp/100)+1;eq(lv,2);GS.student.xp=0;});
test('Quiz state resets between units', function(){GS.quizState={answers:{0:2,1:1},submitted:true,currentStep:2};GS.quizState={answers:{},submitted:false,currentStep:0};eq(GS.quizState.submitted,false);});
test('Note saved to correct unit ID', function(){GS.student.notes['unit-5']='maths note';eq(GS.student.notes['unit-5'],'maths note');delete GS.student.notes['unit-5'];});

// ===== SUITE 3: LocalStorage Integration =====
suite('3. LocalStorage Cross-Module Integration');

test('Save and reload student name persists', function(){localStorage.setItem('gs_student_name','Fatima');var loaded=localStorage.getItem('gs_student_name');eq(loaded,'Fatima');localStorage.removeItem('gs_student_name');});
test('Completed units persist across reload simulation', function(){var units=[1,3,5,7,9];localStorage.setItem('gs_completed',JSON.stringify(units));var loaded=JSON.parse(localStorage.getItem('gs_completed')||'[]');eq(loaded.length,5);eq(loaded[2],5);localStorage.removeItem('gs_completed');});
test('Notes persist with Arabic content', function(){var notes={'unit-1':'المضارع البسيط مهم جداً'};localStorage.setItem('gs_notes',JSON.stringify(notes));var l=JSON.parse(localStorage.getItem('gs_notes')||'{}');ok(l['unit-1'].includes('مهم'));localStorage.removeItem('gs_notes');});
test('Highlights HTML persists', function(){var hl={'unit-3':'<span class="hl">text</span>'};localStorage.setItem('gs_highlights',JSON.stringify(hl));var l=JSON.parse(localStorage.getItem('gs_highlights')||'{}');has(l['unit-3'],'hl');localStorage.removeItem('gs_highlights');});
test('Theme persists dark/light toggle', function(){localStorage.setItem('gs_theme','dark');eq(localStorage.getItem('gs_theme'),'dark');localStorage.setItem('gs_theme','light');eq(localStorage.getItem('gs_theme'),'light');localStorage.removeItem('gs_theme');});
test('XP and level persist together', function(){localStorage.setItem('gs_xp','350');localStorage.setItem('gs_level','4');eq(parseInt(localStorage.getItem('gs_xp'),10),350);eq(parseInt(localStorage.getItem('gs_level'),10),4);localStorage.removeItem('gs_xp');localStorage.removeItem('gs_level');});

// ===== SUITE 4: Icon System Integration =====
suite('4. Icon System Integration (Injection into DOM)');

test('Icons inject correctly into span containers', function(){
  var span=document.createElement('span');
  span.style.width='24px';span.style.height='24px';
  span.innerHTML=window.getIcon('book');
  document.body.appendChild(span);
  ok(span.querySelector('svg'),'Expected SVG element in span');
  span.remove();
});
test('Multiple icons inject without conflict', function(){
  var icons=['book','home','note','target','moon','sun'];
  icons.forEach(function(name){
    var span=document.createElement('span');
    span.innerHTML=window.getIcon(name);
    document.body.appendChild(span);
    ok(span.querySelector('svg'),'SVG missing for '+name);
    span.remove();
  });
});
test('SVG icons have correct class for CSS targeting', function(){
  var span=document.createElement('span');
  span.innerHTML=window.getIcon('book');
  document.body.appendChild(span);
  ok(span.querySelector('.ay-ic'),'Expected .ay-ic class on SVG');
  span.remove();
});
test('Emoji fallback injects SVG not text', function(){
  var span=document.createElement('span');
  span.innerHTML=window.getIcon('📘');
  document.body.appendChild(span);
  ok(span.querySelector('svg'),'Expected SVG, not text emoji');
  span.remove();
});

// ===== SUITE 5: Quiz Flow Integration =====
suite('5. Quiz Flow Integration');

var mockQuizData = [
  {q:'What tense is "He plays"?', opts:['Past','Present Simple','Future','Perfect'], c:1, expl:'Present Simple for habits'},
  {q:'Which signal word for Past Simple?', opts:['already','yesterday','just','ever'], c:1, expl:'Yesterday signals Past Simple'},
  {q:'He ___ (go) to school daily.', opts:['gone','went','goes','go'], c:2, expl:'Present Simple: goes'},
];
var qState={answers:{},submitted:false,currentStep:0};

test('Quiz initializes with empty answers', function(){eq(Object.keys(qState.answers).length,0);});
test('Answer selection stores correctly', function(){qState.answers[0]=1;eq(qState.answers[0],1);});
test('Cannot skip unanswered check', function(){var hasAns=qState.answers[1]!==undefined;eq(hasAns,false);});
test('Score calculation uses stored answers', function(){var correct=0;mockQuizData.forEach(function(q,i){if(qState.answers[i]===q.c)correct++;});eq(correct,1);});
test('Quiz completion sets submitted=true', function(){qState.submitted=true;ok(qState.submitted);});
test('Reset quiz clears state', function(){qState={answers:{},submitted:false,currentStep:0};eq(qState.submitted,false);eq(Object.keys(qState.answers).length,0);});

// ===== SUITE 6: Track Switching =====
suite('6. Track Switching Logic');

var trackMap={grammar:'استراتيجيات الجرامر',reading:'استراتيجيات الريدينق',listening:'استراتيجيات الليسنينق',tests:'محاكاة STEP'};

test('All 4 tracks defined', function(){eq(Object.keys(trackMap).length,4);});
test('Grammar track resolves correct name', function(){ok(trackMap['grammar'].includes('الجرامر'));});
test('Reading track resolves correct name', function(){ok(trackMap['reading'].includes('الريدينق'));});
test('Listening track resolves correct name', function(){ok(trackMap['listening'].includes('الليسنينق'));});
test('Tests track resolves correct name', function(){ok(trackMap['tests'].includes('STEP'));});
test('Unknown track returns undefined', function(){eq(trackMap['unknown'],undefined);});

// ===== SUITE 7: Dark Mode Integration =====
suite('7. Dark Mode Integration');

test('Dark mode class toggles on body', function(){
  document.body.classList.add('dark-mode');
  ok(document.body.classList.contains('dark-mode'));
  document.body.classList.remove('dark-mode');
  ok(!document.body.classList.contains('dark-mode'));
});
test('Theme preference saved on toggle', function(){
  localStorage.setItem('gs_theme','dark');
  var saved=localStorage.getItem('gs_theme');
  eq(saved,'dark');
  localStorage.removeItem('gs_theme');
});
test('Dark mode persists on reload (simulation)', function(){
  localStorage.setItem('gs_theme','dark');
  var theme=localStorage.getItem('gs_theme');
  if(theme==='dark')document.body.classList.add('dark-mode');
  ok(document.body.classList.contains('dark-mode'));
  document.body.classList.remove('dark-mode');
  localStorage.removeItem('gs_theme');
});

// ===== SUITE 8: Responsive Layout Logic =====
suite('8. Responsive Layout Integration');

test('Mobile breakpoint <=768px', function(){ok(768<=768);});
test('Tablet breakpoint 769-1024px', function(){ok(769>768&&769<=1024);});
test('Desktop breakpoint >1024px', function(){ok(1025>1024);});
test('Sidebar collapse CSS class exists (can be toggled)', function(){
  var div=document.createElement('div');
  div.classList.add('units-panel');
  document.body.appendChild(div);
  div.classList.add('collapsed');
  ok(div.classList.contains('collapsed'));
  div.classList.remove('collapsed');
  ok(!div.classList.contains('collapsed'));
  div.remove();
});
test('FAB visible class can be added/removed', function(){
  var btn=document.createElement('button');
  btn.classList.add('fab-scroll');
  document.body.appendChild(btn);
  btn.classList.add('visible');
  ok(btn.classList.contains('visible'));
  btn.classList.remove('visible');
  ok(!btn.classList.contains('visible'));
  btn.remove();
});

// ===== SUITE 9: Error Handling =====
suite('9. Error Handling & Edge Cases');

test('getIcon with null returns fallback', function(){
  var result=window.getIcon(null);
  ok(result,'Should return fallback, not throw');
});
test('getIcon with empty string returns fallback', function(){
  var result=window.getIcon('');
  ok(result,'Should return fallback, not throw');
});
test('Progress calc with 0 units is safe', function(){
  var pct=0===0?0:Math.round((0/0)*100);
  eq(pct,0);
});
test('JSON.parse of empty string is safe with fallback', function(){
  var val=JSON.parse(localStorage.getItem('nonexistent_key')||'[]');
  ok(Array.isArray(val));
});
test('parseInt with invalid returns 0 via fallback', function(){
  var val=parseInt(undefined||'0',10);
  eq(val,0);
});

// ===== SUITE 10: Server API Deep Tests =====
suite('10. Server API Response Validation');

asyncTest('Grammar units have id, nameAr, nameEn fields', fetch('/api/units').then(function(r){return r.json();}).then(function(d){
  if(!d.grammar||d.grammar.length===0)throw new Error('No grammar units');
  var u=d.grammar[0];
  if(!u.id)throw new Error('Missing id');
  if(!u.nameAr)throw new Error('Missing nameAr');
  if(!u.nameEn)throw new Error('Missing nameEn');
}));
asyncTest('Grammar units have page.strategies', fetch('/api/units').then(function(r){return r.json();}).then(function(d){
  if(!d.grammar||d.grammar.length===0)throw new Error('No grammar units');
  var u=d.grammar[0];
  if(!u.page||!Array.isArray(u.page.strategies))throw new Error('Missing page.strategies');
}));
asyncTest('Reading track exists (or empty array)', fetch('/api/units').then(function(r){return r.json();}).then(function(d){
  ok('reading' in d,'reading track missing from API');
  ok(Array.isArray(d.reading),'reading should be array');
}));
asyncTest('Listening track exists (or empty array)', fetch('/api/units').then(function(r){return r.json();}).then(function(d){
  ok('listening' in d,'listening track missing from API');
}));
asyncTest('API response time < 2000ms', function(){
  var start=Date.now();
  return fetch('/api/units').then(function(){
    var elapsed=Date.now()-start;
    if(elapsed>2000)throw new Error('API too slow: '+elapsed+'ms');
  });
}());

// Final
setTimeout(function(){
  var pct=R.total>0?Math.round((R.pass/R.total)*100):0;
  var color=pct>=80?'#22c55e':pct>=60?'#eab308':'#ef4444';
  document.getElementById('run-info').innerHTML='Completed at '+new Date().toLocaleTimeString('ar-SA')+' | <strong style="color:'+color+'">'+pct+'%</strong> ('+R.pass+' pass / '+R.fail+' fail / '+R.skip+' skip / '+R.total+' total)';
},3000);
</script>
</body>
</html>
