<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Grammar Strategies</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">⚙️</span>
        <h2>لوحة التحكم</h2>
      </div>
      <nav class="nav-links">
        <button class="nav-link active" data-view="units">📚 إدارة الوحدات المنهجية</button>
        <a href="/" class="nav-link view-site" target="_blank">👁️ معاينة الموقع</a>
      </nav>
      <button class="btn btn-save-all" id="save-all-btn">💾 حفظ التعديلات في النظام</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>إدارة المحتوى والمناهج (CRUD)</h1>
          <select id="track-selector" style="margin-top: 10px; padding: 5px 10px; font-family: 'Cairo'; border-radius: 5px; font-size: 1rem;">
            <option value="grammar">📖 استراتيجيات الجرامر</option>
            <option value="reading">📚 استراتيجيات الريدينق</option>
            <option value="listening">🎧 استراتيجيات الليسينيق</option>
            <option value="tests">📝 50 نموذج اختبار شامل</option>
          </select>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" id="add-unit-btn">+ إضافة وحدة جديدة</button>
        </div>
      </header>

      <div class="content-area" id="content-area">
        <!-- Units list will be rendered here -->
        <div id="units-list" class="units-grid"></div>
      </div>
    </main>
  </div>

  <!-- Unit Modal -->
  <div class="modal hidden" id="unit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="unit-modal-title">تعديل الوحدة</h2>
        <button class="close-btn" data-close="unit-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>الرقم التعريفي (ID)</label>
          <input type="number" id="unit-id" placeholder="مثال: 13">
        </div>
        <div class="form-group">
          <label>رمز الأيقونة (Emoji)</label>
          <input type="text" id="unit-emoji" placeholder="مثال: 🌟">
        </div>
        <div class="form-group">
          <label>اسم الوحدة (عربي)</label>
          <input type="text" id="unit-name-ar" placeholder="مثال: الأسماء">
        </div>
        <div class="form-group">
          <label>اسم الوحدة (إنجليزي)</label>
          <input type="text" id="unit-name-en" placeholder="مثال: Nouns">
        </div>
        <div class="form-group">
          <label>تصنيف الوحدة (Tag)</label>
          <input type="text" id="unit-tag" placeholder="مثال: الوحدة الثالثة عشر">
        </div>
        
        <hr>
        <div class="flex-between">
          <h3>الاستراتيجيات (شرح القواعد)</h3>
          <button class="btn btn-secondary btn-sm" id="add-strategy-btn">+ إضافة استراتيجية</button>
        </div>
        <div id="strategies-list" class="nested-list"></div>

        <hr>
        <div class="flex-between">
          <h3>الاختبار الشامل للوحدة</h3>
          <button class="btn btn-secondary btn-sm" id="add-quiz-btn">+ إضافة سؤال</button>
        </div>
        <div id="quizzes-list" class="nested-list"></div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="save-unit-btn">حفظ الوحدة</button>
      </div>
    </div>
  </div>

  <!-- Strategy Modal -->
  <div class="modal hidden" id="strategy-modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h2 id="strategy-modal-title">تعديل الاستراتيجية</h2>
        <button class="close-btn" data-close="strategy-modal">✕</button>
      </div>
      <div class="modal-body">
        <!-- Basic Info -->
        <div class="form-grid">
          <div class="form-group">
            <label>عنوان الاستراتيجية</label>
            <input type="text" id="strat-title" placeholder="المضارع التام">
          </div>
          <div class="form-group">
            <label>العنوان الفرعي (Subtitle)</label>
            <input type="text" id="strat-subtitle" placeholder="Present Perfect" dir="ltr">
          </div>
          <div class="form-group">
            <label>أيقونة</label>
            <input type="text" id="strat-icon" placeholder="✅">
          </div>
          <div class="form-group">
            <label>الوسم (Badge)</label>
            <input type="text" id="strat-badge" placeholder="Tense 1/6" dir="ltr">
          </div>
        </div>
        <div class="form-group">
          <label>لون التصميم (Theme)</label>
          <select id="strat-theme">
            <option value="sc-theme-blue">أزرق داكن (Blue)</option>
            <option value="sc-theme-teal">سماوي (Teal)</option>
            <option value="sc-theme-green">أخضر (Green)</option>
            <option value="sc-theme-red">أحمر (Red)</option>
            <option value="sc-theme-purple">بنفسجي (Purple)</option>
            <option value="sc-theme-gold">ذهبي (Gold)</option>
          </select>
        </div>
        <div class="form-group">
          <label>الاستخدام (Usage)</label>
          <textarea id="strat-usage" rows="2"></textarea>
        </div>

        <!-- Media Upload -->
        <div class="media-upload-section">
          <h3>الوسائط (صورة / صوت)</h3>
          <div class="form-group">
            <label>إرفاق صورة توضيحية للشرح</label>
            <input type="file" id="strat-image-upload" accept="image/*">
            <input type="hidden" id="strat-image-url">
            <div id="strat-image-preview" class="media-preview"></div>
          </div>
          <div class="form-group">
            <label>إرفاق ملف صوتي للشرح (Audio)</label>
            <input type="file" id="strat-audio-upload" accept="audio/*">
            <input type="hidden" id="strat-audio-url">
            <div id="strat-audio-preview" class="media-preview"></div>
          </div>
        </div>

        <!-- Tabs for complex data -->
        <div class="tabs">
          <button class="tab-btn active" data-target="tab-keywords">الكلمات الدالة</button>
          <button class="tab-btn" data-target="tab-formulas">التكوين</button>
          <button class="tab-btn" data-target="tab-exceptions">الشواذ</button>
          <button class="tab-btn" data-target="tab-practice">جرب بنفسك</button>
        </div>

        <div class="tab-content active" id="tab-keywords">
          <button class="btn btn-sm btn-secondary mb-1" id="add-kw-btn">+ إضافة كلمة دالة</button>
          <div id="kw-list"></div>
        </div>

        <div class="tab-content" id="tab-formulas">
          <button class="btn btn-sm btn-secondary mb-1" id="add-formula-btn">+ إضافة تكوين</button>
          <div id="formula-list"></div>
        </div>

        <div class="tab-content" id="tab-exceptions">
          <div class="form-group">
            <label>عنوان الشواذ والملاحظات</label>
            <input type="text" id="ex-title" placeholder="⚠️ حالة خاصة">
          </div>
          <div class="form-group">
            <label>تفاصيل الشواذ (يدعم HTML)</label>
            <textarea id="ex-body" rows="3"></textarea>
          </div>
          <small>اترك العنوان فارغاً إذا لم يوجد شواذ لهذه القاعدة.</small>
        </div>

        <div class="tab-content" id="tab-practice">
          <button class="btn btn-sm btn-secondary mb-1" id="add-practice-btn">+ إضافة سؤال تطبيق مباشر</button>
          <div id="practice-list"></div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="save-strategy-btn">حفظ الاستراتيجية</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="admin.js"></script>
</body>
</html>
